services:
  andes-api:
    build: ./server
    restart: unless-stopped
    environment:
      ANDES_API_TOKEN: ${ANDES_API_TOKEN:?Define ANDES_API_TOKEN}
      OLLAMA_URL: ${OLLAMA_URL:-https://ollama-qwen.cmaquera.com}
      OLLAMA_MODEL: qwen3:4b-instruct-2507-q4_K_M
    expose:
      - "8787"
    volumes:
      - andes-cache:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: 0.5
volumes:
  andes-cache:
networks:
  dokploy-network:
    external: true
